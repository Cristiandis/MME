[manifest]
version = "1.0.0"
dump_lua = true
priority = 10

[[patches]]
[patches.pattern]
target = "engine/text.lua"
pattern = """
function DynaText:init(config)
    config = config or {}
"""
position = "after"
payload = """
    if config.font and type(config.font) == "string" then
        config.font = SMODS.Fonts[config.font] or G.FONTS[config.font] or G.LANG.font
    end
"""
match_indent = true
